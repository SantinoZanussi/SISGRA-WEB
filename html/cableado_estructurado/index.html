<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiSGRA S.R.L. - Cableado Estructurado</title>
    <meta name="description" content="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" href="/img/sdesigra.png">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages/cableado.css">

    <style>
        /* RESPONSIVE OVERRIDES (preservadas del HTML original) */

        /* SECCIÓN CABLEADO */
        @media (max-width: 1023px) {
            .section-cableado { padding: 7rem 1.5rem 5rem; }
        }
        @media (max-width: 639px) {
            .section-cableado { padding: 6rem 1rem 4rem; }
        }

        .container-7xl {
            max-width: 80rem;
            margin: 0 auto;
        }

        @media (max-width: 1023px) {
            .section-title { font-size: 3rem; }
        }
        @media (max-width: 639px) {
            .section-title { font-size: 2.25rem; letter-spacing: -0.03em; }
        }

        @media (max-width: 1023px) { .cableado-grid { gap: 3rem; } }
        @media (max-width: 639px)  { .cableado-grid { gap: 2rem; } }
        @media (max-width: 639px)  { .spec-card { padding: 1.25rem; gap: 1rem; } }
        @media (max-width: 639px) {
            .dark-panel { padding: 1.75rem 1.25rem; }
            .panel-value { font-size: 1.75rem; }
            .stat-value  { font-size: 1.5rem; }
        }
        @media (max-width: 639px) {
            .section-header { margin-bottom: 3rem; margin-top: 40px; }
        }

        /* FOOTER RESPONSIVE */
        @media (max-width: 1023px) {
            .footer-grid { grid-template-columns: 1fr 1fr; }
            .footer-col:last-child { grid-column: 1 / -1; }
            .map-wrapper, .map-wrapper iframe { min-height: 220px; }
        }
        @media (max-width: 639px) {
            .footer-grid { grid-template-columns: 1fr; }
            .footer-col:last-child { grid-column: 1; }
            .footer-col {
                padding: 1.5rem !important;
                border-right: none !important;
                border-bottom: 1px solid var(--rule);
            }
            .footer-col:last-child { border-bottom: none; }
        }
        @media (max-width: 639px) {
            .wordmark-band {
                padding: 2rem 1.5rem 1.5rem;
                flex-direction: column;
                align-items: flex-start;
                gap: 0.75rem;
            }
            .wordmark-band h1 { font-size: clamp(52px, 18vw, 80px); }
            .wordmark-band .tagline { text-align: left; max-width: 100%; }
        }
        @media (max-width: 639px) {
            .footer-bottom {
                padding: 1.25rem 1.5rem;
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }
            .footer-bottom .copy { font-size: 0.5625rem; }
        }
        @media (max-width: 639px) { .col-label { margin-bottom: 1.25rem; } }
    </style>
</head>
<body>

<!--
  SHELL — el contenido lo controla la plantilla activa "cableado" desde
  el panel de admin (html/admin_panel.html). Visualmente idéntico al
  HTML estático original. Si querés volver al estático, restaurá desde git.
-->
<div id="plantilla-root">
  <div style="padding:6rem 2rem;text-align:center;color:#94a3b8;font-family:'Inter',system-ui,sans-serif;letter-spacing:.15em;text-transform:uppercase;font-size:.75rem;">Cargando…</div>
</div>

<script type="module">
  import { bootstrapPage } from '/services/page-bootstrap.js';
  bootstrapPage('cableado', 'plantilla-root');
</script>

</body>
</html>
