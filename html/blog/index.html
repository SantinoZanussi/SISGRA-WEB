<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISGRA S.R.L. - Blog</title>
    <meta name="description" content="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="icon" href="/img/sdesigra.png">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages/blog.css">

    <style>
        /* RESPONSIVE OVERRIDES (preservadas del HTML original) */
        @media (max-width: 1023px) {
            .blog-container { padding: 7rem 1.5rem 5rem; }
        }
        @media (max-width: 639px) {
            .blog-container { padding: 6rem 1rem 4rem; }
        }

        /* FOOTER RESPONSIVE */
        @media (max-width: 1023px) {
            .footer-grid { grid-template-columns: 1fr 1fr; }
            .footer-col:last-child { grid-column: 1 / -1; }
            .map-wrapper, .map-wrapper iframe { min-height: 220px; }
        }
        @media (max-width: 639px) {
            .footer-grid { grid-template-columns: 1fr; }
            .footer-col { padding: 1.5rem !important; border-right: none !important; border-bottom: 1px solid var(--rule); }
            .footer-col:last-child { border-bottom: none; }
            .wordmark-band { padding: 2rem 1.5rem 1.5rem; }
            .wordmark-band h1 { font-size: clamp(52px, 18vw, 80px); }
            .footer-bottom { padding: 1.25rem 1.5rem; flex-direction: column; align-items: flex-start; gap: 0.5rem; }
        }
    </style>
</head>
<body>

<!-- shell controlado por la plantilla activa "blog" desde el admin; los articulos vienen de /api/data/blog -->
<div id="plantilla-root">
  <div style="padding:6rem 2rem;text-align:center;color:#94a3b8;font-family:'Inter',system-ui,sans-serif;letter-spacing:.15em;text-transform:uppercase;font-size:.75rem;">Cargando…</div>
</div>

<script type="module">
  import { bootstrapPage } from '/services/page-bootstrap.js';
  bootstrapPage('blog', 'plantilla-root');
</script>

</body>
</html>
