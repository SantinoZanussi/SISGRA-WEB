<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiSGRA S.R.L. - Fibra Óptica</title>
    <meta name="description" content="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="icon" href="/img/sdesigra.png">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages/fibra_optica.css">

    <style>
        /* RESPONSIVE OVERRIDES (preservadas del HTML original) */
        @media (max-width: 1023px) { .section-fibra { padding: 7rem 1.5rem 5rem; } }
        @media (max-width: 639px)  { .section-fibra { padding: 6rem 1rem 4rem; } }

        @media (max-width: 1023px) {
            .fibra-layout { grid-template-columns: 1fr; gap: 3rem; }
            .fibra-visual { order: -1; }
        }
        @media (max-width: 639px) {
            .fibra-layout { gap: 2rem; }
            .section-title { font-size: 2.5rem; }
            .section-description { font-size: 0.95rem; }
        }

        /* FOOTER RESPONSIVE */
        @media (max-width: 1023px) {
            .footer-grid { grid-template-columns: 1fr 1fr; }
            .footer-col:last-child { grid-column: 1 / -1; }
            .map-wrapper, .map-wrapper iframe { min-height: 220px; }
        }
        @media (max-width: 639px) {
            .footer-grid { grid-template-columns: 1fr; }
            .footer-col:last-child { grid-column: 1; }
            .footer-col {
                padding: 1.5rem !important;
                border-right: none !important;
                border-bottom: 1px solid var(--rule);
            }
            .footer-col:last-child { border-bottom: none; }
            .wordmark-band {
                padding: 2rem 1.5rem 1.5rem;
                flex-direction: column;
                align-items: flex-start;
                gap: 0.75rem;
            }
            .wordmark-band h1 { font-size: clamp(52px, 18vw, 80px); }
            .footer-bottom {
                padding: 1.25rem 1.5rem;
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }
            .footer-bottom .copy { font-size: 0.5625rem; }
        }
    </style>
</head>
<body>

<!--
  SHELL — controlado por la plantilla activa "fibra" desde el admin.
  Visualmente idéntico al HTML original.
-->
<div id="plantilla-root">
  <div style="padding:6rem 2rem;text-align:center;color:#94a3b8;font-family:'Inter',system-ui,sans-serif;letter-spacing:.15em;text-transform:uppercase;font-size:.75rem;">Cargando…</div>
</div>

<script type="module">
  import { bootstrapPage } from '/services/page-bootstrap.js';
  bootstrapPage('fibra', 'plantilla-root');
</script>

</body>
</html>
