<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiSGRA S.R.L. - Soporte IT</title>
    <meta name="description" content="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" href="/img/sdesigra.png">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages/soporte_it.css">

    <style>
        /* ── RESPONSIVE OVERRIDES (preservadas del HTML original) ─── */
        @media (max-width: 1023px) {
            .hero-section { padding: 7rem 0 5rem; }
            .hero-grid { grid-template-columns: 1fr !important; gap: 3rem; }
            .hero-content { order: 2; }
            .hero-dashboard { order: 1; }
            .dashboard-box { width: 100%; }
            .hero-title { font-size: 4rem; line-height: 0.95; }
            .hero-description { font-size: 1rem; }
        }
        @media (max-width: 639px) {
            .hero-section { padding: 6rem 0 4rem; }
            .container { padding: 0 1rem; }
            .hero-title { font-size: 2.7rem; margin-bottom: 1.5rem; }
            .hero-description { font-size: 0.95rem; }
            .badge { font-size: 0.6rem; letter-spacing: 0.2em; }
            .features-list { gap: 1rem; }
            .feature-card { padding: 1rem; flex-direction: row; align-items: flex-start; }
            .feature-icon { font-size: 1.5rem; }
            .dashboard-box { padding: 1.25rem; margin-top: 40px; }
            .dash-main-value { font-size: 3rem; }
            .dash-grid { grid-template-columns: 1fr; gap: 1rem; }
            .btn-remote { width: 100%; font-size: 0.75rem; padding: 1rem; }
        }

        /* FOOTER RESPONSIVE */
        @media (max-width: 1023px) {
            .footer-grid { grid-template-columns: 1fr 1fr; }
            .footer-col:last-child { grid-column: 1 / -1; }
            .map-wrapper, .map-wrapper iframe { min-height: 220px; }
        }
        @media (max-width: 639px) {
            .footer-grid { grid-template-columns: 1fr; }
            .footer-col:last-child { grid-column: 1; }
            .footer-col {
                padding: 1.5rem !important;
                border-right: none !important;
                border-bottom: 1px solid var(--rule);
            }
            .footer-col:last-child { border-bottom: none; }
            .wordmark-band {
                padding: 2rem 1.5rem 1.5rem;
                flex-direction: column;
                align-items: flex-start;
                gap: 0.75rem;
            }
            .wordmark-band h1 { font-size: clamp(52px, 18vw, 80px); }
            .footer-bottom {
                padding: 1.25rem 1.5rem;
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }
            .footer-bottom .copy { font-size: 0.5625rem; }
        }
    </style>
</head>
<body>

<!-- SHELL — controlado por la plantilla activa "soporte" desde el admin -->
<div id="plantilla-root">
  <div style="padding:6rem 2rem;text-align:center;color:#94a3b8;font-family:'Inter',system-ui,sans-serif;letter-spacing:.15em;text-transform:uppercase;font-size:.75rem;">Cargando…</div>
</div>

<script type="module">
  import { bootstrapPage } from '/services/page-bootstrap.js';
  bootstrapPage('soporte', 'plantilla-root');
</script>

</body>
</html>
